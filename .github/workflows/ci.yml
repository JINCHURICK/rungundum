name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Verificação de tipos e build ─────────────────────────────────────────────
  build:
    name: Build & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      - name: Type check server
        working-directory: server
        run: npx tsc --noEmit

      - name: Type check client
        working-directory: client
        run: npx tsc --noEmit

      - name: Build server
        working-directory: server
        run: npx tsc

      - name: Build client
        working-directory: client
        run: npm run build

  # ── Deploy para Hostinger via SSH ────────────────────────────────────────────
  # Para activar: adiciona os seguintes Secrets no GitHub (Settings > Secrets):
  #   SSH_HOST     → IP ou domínio do servidor (ex: rungundum.com)
  #   SSH_USERNAME → utilizador SSH do Hostinger
  #   SSH_KEY      → chave SSH privada (gera com: ssh-keygen -t ed25519)
  #   SSH_PORT     → porta SSH (normalmente 65002 no Hostinger)
  #   DEPLOY_PATH  → caminho do projecto no servidor (ex: /home/u123/nodejs)
  deploy:
    name: Deploy to Hostinger
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: Install and build server
        working-directory: server
        run: npm ci && npx tsc

      - name: Install and build client
        working-directory: client
        run: npm ci && npm run build

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host:     ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key:      ${{ secrets.SSH_KEY }}
          port:     ${{ secrets.SSH_PORT || 65002 }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}

            # Actualizar código
            git pull origin main

            # Instalar dependências novas (se houver)
            cd server && npm install --production && cd ..

            # Executar migrações Prisma em produção
            cd server && npx prisma migrate deploy && cd ..

            # O Hostinger reinicia o processo automaticamente via LSNODE_SOCKET
            # quando o entry point é modificado — toca o ficheiro para forçar restart
            touch server/dist/index.js

            echo "Deploy concluído em $(date)"
